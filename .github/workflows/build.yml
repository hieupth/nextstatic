# Build the example on every push to main — catches breakage early.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  example:
    name: Build example → gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Build lib
        run: npm ci && npm run build

      # Regression gate: unit + fuzz + render-oracle suites must pass
      # BEFORE anything is deployed. A red test stops the pipeline here.
      - name: Test lib
        run: npm test && npm run test:components

      - name: Build example
        run: |
          cd examples
          npm ci
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Security gate: fail on high+ advisories in either dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high && cd examples && npm audit --audit-level=high

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: examples/out
